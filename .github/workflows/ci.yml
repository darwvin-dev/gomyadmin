name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gomyadmin
          POSTGRES_PASSWORD: gomyadmin
          POSTGRES_DB: gomyadmin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gomyadmin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: go test ./...
      - run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: templates/frontend-next-shadcn/package.json
      - working-directory: templates/frontend-next-shadcn
        run: npm install
      - working-directory: templates/frontend-next-shadcn
        run: npm run typecheck
      - working-directory: templates/frontend-next-shadcn
        run: npm run build
