name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gomyadmin
          POSTGRES_PASSWORD: gomyadmin
          POSTGRES_DB: gomyadmin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test
        env:
          DATABASE_URL: postgres://gomyadmin:gomyadmin@localhost:5432/gomyadmin?sslmode=disable
        run: go test ./...

      - name: Integration tests
        env:
          DATABASE_URL: postgres://gomyadmin:gomyadmin@localhost:5432/gomyadmin?sslmode=disable
        run: go test -tags integration ./tests/integration/... -timeout 120s

      - name: Check coverage
        env:
          DATABASE_URL: postgres://gomyadmin:gomyadmin@localhost:5432/gomyadmin?sslmode=disable
        run: |
          go test ./... -coverprofile=coverage.out -timeout 120s
          go tool cover -func=coverage.out | awk '/total:/ {pct=$3+0; if (pct < 90) { print "Coverage " $3 " is below 90%"; exit 1 } else { print "Coverage " $3 " OK" }}'
